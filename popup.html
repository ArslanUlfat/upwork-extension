<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upwork Rails Scraper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h2>🚀 Rails Jobs Scraper</h2>
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search for Rails jobs..." value="rails">
            <button id="scrapeBtn">Scrape Jobs</button>
        </div>
    </div>
    
    <div class="controls">
        <div class="filter-controls">
            <select id="sortFilter">
                <option value="date">Sort by Date</option>
                <option value="budget">Sort by Budget</option>
                <option value="title">Sort by Title</option>
            </select>
            <button id="clearBtn">Clear All</button>
        </div>
        <div class="stats">
            <span id="jobCount">0 jobs found</span>
        </div>
    </div>

    <div id="loadingIndicator" class="hidden loading">
        <div class="spinner"></div>
        <p>Scraping jobs...</p>
    </div>

    <div id="errorMessage" class="hidden error">
        <p>Please navigate to Upwork job search page first</p>
    </div>

    <div id="jobsList" class="jobs-container">
        <!-- Jobs will be populated here -->
    </div>

    <div class="auto-scrape-section">
        <div class="auto-scrape-header">
            <h3>🤖 Auto-Scraper</h3>
            <div class="toggle-switch">
                <input type="checkbox" id="autoScrapeToggle" class="toggle-input">
                <label for="autoScrapeToggle" class="toggle-label">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
        
        <div id="autoScrapeControls" class="hidden auto-scrape-controls">
            <div class="control-row">
                <label>Interval:</label>
                <select id="scrapeInterval">
                    <option value="15">Every 15 minutes</option>
                    <option value="30" selected>Every 30 minutes</option>
                    <option value="60">Every hour</option>
                    <option value="120">Every 2 hours</option>
                    <option value="360">Every 6 hours</option>
                    <option value="720">Every 12 hours</option>
                    <option value="1440">Every 24 hours</option>
                </select>
            </div>
            
            <div class="control-row">
                <label>Search Queries:</label>
                <input type="text" id="searchQueries" placeholder="rails, ruby on rails, ruby developer" />
            </div>
            
            <div class="control-row">
                <label>Max jobs per alert:</label>
                <select id="maxJobsAlert">
                    <option value="3">3 jobs</option>
                    <option value="5" selected>5 jobs</option>
                    <option value="10">10 jobs</option>
                    <option value="15">15 jobs</option>
                </select>
            </div>
            
            <div class="control-row">
                <label>
                    <input type="checkbox" id="slackNotifications" checked>
                    Send new jobs to Slack
                </label>
            </div>
            
            <div id="autoScrapeStatus" class="auto-scrape-status">
                <span id="lastScrapeTime">Never</span>
            </div>
        </div>
    </div>

    <div class="slack-section">
        <div class="slack-header">
            <h3>📤 Send to Slack</h3>
            <div class="slack-controls">
                <select id="slackFormat">
                    <option value="summary">Summary (5 jobs)</option>
                    <option value="detailed">Detailed List</option>
                    <option value="all">All Jobs</option>
                </select>
                <button id="sendSlackBtn">Send to Slack</button>
            </div>
        </div>
        <!-- Slack settings -->
        <div class="control-row" style="margin-top:8px;">
            <label for="slackWebhook" style="min-width:120px;">Slack Webhook:</label>
            <input type="text" id="slackWebhook" placeholder="https://hooks.slack.com/services/..." style="flex:1;" />
            <button id="saveSlackBtn" style="margin-left:8px;">Save</button>
        </div>
        <div style="font-size:12px;color:#666;margin-top:6px;">
            Webhook is stored locally in the extension only. Required to enable Slack sending from popup.
        </div>
        <div id="slackStatus" class="hidden slack-status"></div>
    </div>

    <div class="footer">
        <button id="exportBtn">Export to JSON</button>
        <a href="https://www.upwork.com/nx/search/jobs/?q=rails" target="_blank" id="openUpwork">
            Open Upwork
        </a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
