<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Upwork Scraper - AI Master v3.0.0</title>
  
  <style>
    /* Embedded CSS for reliable loading in extension popup */
    :root {
      --primary-color: #38e07b;
      --background-light: #f6f8f7;
      --background-dark: #122017;
      --content-light: #122017;
      --content-dark: #f6f8f7;
      --subtle-light: #4b5563;
      --subtle-dark: #9ca3af;
      --border-light: #e5e7eb;
      --border-dark: #374151;
      --blue-500: #3b82f6;
      --yellow-400: #fbbf24;
      --red-500: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    [data-theme="dark"] {
      --current-bg: var(--background-dark);
      --current-content: var(--content-dark);
      --current-subtle: var(--subtle-dark);
      --current-border: var(--border-dark);
    }

    [data-theme="light"], :root {
      --current-bg: var(--background-light);
      --current-content: var(--content-light);
      --current-subtle: var(--subtle-light);
      --current-border: var(--border-light);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--current-bg);
      color: var(--current-content);
      width: 400px;
      min-height: 600px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      min-height: 600px;
      height: 100%;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: rgba(246, 248, 247, 0.95);
      border-bottom: 1px solid var(--current-border);
    }

    [data-theme="dark"] .header {
      background-color: rgba(18, 32, 23, 0.95);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 4rem;
      padding: 0 1rem;
    }

    .header-button {
      padding: 0.5rem;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--current-content);
      cursor: pointer;
      transition: background-color 0.2s;
      position: relative;
    }

    .header-button:hover {
      background-color: rgba(56, 224, 123, 0.1);
    }

    .header-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--current-content);
    }

    .notification-dot {
      position: absolute;
      top: 0.25rem;
      right: 0.25rem;
      width: 0.5rem;
      height: 0.5rem;
      background-color: var(--primary-color);
      border-radius: 50%;
      border: 2px solid var(--current-bg);
    }

    .main-content {
      flex-grow: 1;
      padding: 1rem;
    }

    .section {
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--current-content);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--current-subtle);
      margin-bottom: 0.25rem;
    }

    .form-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.25rem;
    }

    .input-field {
      width: 100%;
      background-color: var(--current-bg);
      border: 1px solid var(--current-border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 0.875rem;
      color: var(--current-content);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(56, 224, 123, 0.2);
    }

    .input-field::placeholder {
      color: var(--current-subtle);
    }

    .btn {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.875rem;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: var(--background-dark);
    }

    .btn-blue {
      background-color: var(--blue-500);
      color: white;
    }

    .btn-full {
      width: 100%;
    }

    .btn-row {
      display: flex;
      gap: 1rem;
      flex-direction: column;
    }

    @media (min-width: 640px) {
      .btn-row {
        flex-direction: row;
      }
      
      .btn-row .btn {
        flex: 1;
      }
    }

    .link-button {
      color: var(--primary-color);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
    }

    .link-button:hover {
      text-decoration: underline;
    }

    .job-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .job-card {
      background-color: var(--current-bg);
      border: 1px solid var(--current-border);
      border-radius: 0.5rem;
      padding: 1rem;
      transition: all 0.2s;
    }

    .job-card.featured {
      background-color: rgba(56, 224, 123, 0.1);
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(56, 224, 123, 0.5);
    }

    [data-theme="dark"] .job-card.featured {
      background-color: rgba(56, 224, 123, 0.2);
    }

    .job-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .job-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--current-content);
      cursor: pointer;
      flex-grow: 1;
      margin-right: 1rem;
    }

    .bookmark-btn {
      padding: 0.25rem;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--current-subtle);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .bookmark-btn:hover {
      background-color: rgba(56, 224, 123, 0.2);
    }

    .job-description {
      font-size: 0.875rem;
      color: var(--current-subtle);
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    .job-tags {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .job-tag {
      background-color: rgba(56, 224, 123, 0.2);
      color: var(--primary-color);
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .job-tag.subtle {
      background-color: rgba(56, 224, 123, 0.1);
    }

    .new-jobs-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary-color);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .footer {
      position: sticky;
      bottom: 0;
      background-color: rgba(246, 248, 247, 0.95);
      border-top: 1px solid var(--current-border);
    }

    [data-theme="dark"] .footer {
      background-color: rgba(18, 32, 23, 0.95);
    }

    .footer-nav {
      display: flex;
      justify-content: space-around;
      padding: 0 1rem;
    }

    .nav-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: 0.5rem;
      color: var(--current-subtle);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-item:hover {
      color: var(--primary-color);
    }

    .nav-item.active {
      color: var(--primary-color);
    }

    .nav-text {
      font-size: 0.75rem;
      font-weight: 500;
    }

    .nav-badge {
      position: absolute;
      top: 0.25rem;
      right: 0.875rem;
      width: 1rem;
      height: 1rem;
      background-color: var(--primary-color);
      color: var(--background-dark);
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* Icon fallbacks */
    .icon {
      width: 24px;
      height: 24px;
      display: inline-block;
      text-align: center;
      line-height: 24px;
    }

    .icon-bookmark::before { content: '🔖'; }
    .icon-settings::before { content: '⚙️'; }
    .icon-search::before { content: '🔍'; }
    .icon-description::before { content: '📄'; }
    .icon-history::before { content: '📋'; }
    .icon-notifications::before { content: '🔔'; }

    .hidden {
      display: none !important;
    }

    /* Dark mode media query fallback */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --current-bg: var(--background-dark);
        --current-content: var(--content-dark);
        --current-subtle: var(--subtle-dark);
        --current-border: var(--border-dark);
      }
      
      :root:not([data-theme="light"]) .header {
        background-color: rgba(18, 32, 23, 0.95);
      }
      
      :root:not([data-theme="light"]) .footer {
        background-color: rgba(18, 32, 23, 0.95);
      }
      
      :root:not([data-theme="light"]) .job-card.featured {
        background-color: rgba(56, 224, 123, 0.2);
      }
    }
  </style>
</head>

<body data-theme="light">
  <div class="main-container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <button class="header-button">
          <span class="icon icon-bookmark"></span>
        </button>
        <h1 class="header-title">Job Scraper AI</h1>
        <button class="header-button" id="settings-btn">
          <span class="icon icon-settings"></span>
          <span class="notification-dot"></span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Search Section -->
      <section class="section">
        <h2 class="section-title">Find Jobs & Generate Proposals</h2>
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="keywords">Keywords</label>
            <button class="link-button" id="save-search-btn">Save Search</button>
          </div>
          <input 
            class="input-field" 
            id="keywords" 
            placeholder="e.g., React, Node.js, UI/UX" 
            type="text" 
            value="React, UI/UX"
          />
        </div>
        
        <div class="form-group">
          <label class="form-label" for="blacklist">Blacklisted Words</label>
          <input 
            class="input-field" 
            id="blacklist" 
            placeholder="e.g., entry-level, urgent" 
            type="text"
          />
        </div>
        
        <div class="btn-row">
          <button class="btn btn-primary btn-full" id="find-jobs-btn">Find Jobs</button>
          <button class="btn btn-blue btn-full" id="auto-apply-btn">
            🤖 Auto find and notify on Slack
          </button>
        </div>
      </section>

      <!-- Job Results Section -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">Job Results</h2>
          <div class="new-jobs-indicator">
            <span class="icon icon-notifications"></span>
            <span>Ready to Search</span>
          </div>
        </div>
        
        <div class="job-list" id="job-list-container">
          <!-- Jobs will be loaded dynamically -->
          <div class="empty-state" style="text-align: center; padding: 3rem 1rem; color: var(--current-subtle);">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
            <h3 style="margin-bottom: 0.5rem; color: var(--current-content);">No Jobs Yet</h3>
            <p style="margin-bottom: 1.5rem;">Enter keywords above and click "Find Jobs" to start scraping Upwork.</p>
            <div style="font-size: 0.875rem; opacity: 0.8;">
              <p>💡 <strong>Tip:</strong> Make sure you're on an Upwork job search page first</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Navigation -->
    <footer class="footer">
      <nav class="footer-nav">
        <a class="nav-item active" href="#" data-nav="scraper">
          <span class="icon icon-search"></span>
          <span class="nav-text">Scraper</span>
          <span class="nav-badge">0</span>
        </a>
        <a class="nav-item" href="#" data-nav="proposals">
          <span class="icon icon-description"></span>
          <span class="nav-text">Proposals</span>
        </a>
        <a class="nav-item" href="#" data-nav="history">
          <span class="icon icon-history"></span>
          <span class="nav-text">History</span>
        </a>
      </nav>
    </footer>
  </div>

  <!-- External JavaScript -->
  <script src="popup-ai-master-fixed.js"></script>
</body>
</html>
